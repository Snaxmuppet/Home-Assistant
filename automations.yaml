- id: '1767075741419'
  alias: EcoFlow Charging Management - old
  description: Manages EcoFlow charging based on time, buttons, and SoC limits.
  triggers:
  - trigger: time
    at: 00:00:00
    id: charge
  - trigger: time
    at: 05:30:00
    id: nocharge
  - trigger: state
    entity_id: input_button.ecoflow_charge
    id: charge
  - trigger: state
    entity_id:
    - input_button.ecoflow_nocharge
    id: nocharge
  - trigger: numeric_state
    entity_id: sensor.stream_system_soc_3
    below: input_number.ecoflow_overnight_lower_charge_limit
    id: charge_soc
  - trigger: numeric_state
    entity_id: sensor.stream_system_soc_3
    above: input_number.ecoflow_overnight_upper_charge_limit
    id: nocharge_soc
  actions:
  - choose:
    - conditions:
      - or:
        - condition: trigger
          id: charge
        - and:
          - condition: trigger
            id: charge_soc
          - condition: time
            after: '23:30:00'
            before: 05:30:00
      sequence:
      - action: number.set_value
        target:
          entity_id: number.stream_1_backup_reserve_level
        data:
          value: '{{ states(''input_number.ecoflow_overnight_upper_charge_limit'')
            | float(0) }}'
    - conditions:
      - or:
        - condition: trigger
          id: nocharge
        - and:
          - condition: trigger
            id: nocharge_soc
          - condition: time
            after: '23:30:00'
            before: 05:30:00
      sequence:
      - action: number.set_value
        target:
          entity_id: number.stream_1_backup_reserve_level
        data:
          value: '{{ states(''input_number.ecoflow_overnight_lower_charge_limit'')
            | float(0) }}'
