blueprint:
  name: Sonoff TRV Offset
  description:
    Automatically adjust the offset of the temperature sensor using an
    external sensor.
  domain: automation
  input:
    climate_entity:
      name: Sonoff TRV Entity
      selector:
        entity:
          filter:
            - domain:
                - climate
          multiple: false
    offset_entity:
      name: TRV Temp Offset Entity
      selector:
        entity:
          filter:
            - domain:
                - number
          multiple: false
    sensor_entity:
      name: External Temp Sensor
      selector:
        entity:
          filter:
            - domain:
                - sensor
            - device_class:
                - temperature
          multiple: false
    sync_entity:
      name: Sync Temp Sensor
      selector:
        entity:
          filter:
            - domain:
                - input_boolean
          multiple: false
  # source_url: https://github.com/arnie580/hass-blueprints/blob/main/sonoff-trv-auto-offset.yaml
mode: single
max_exceeded: silent
variables:
  trv_entity: !input climate_entity
  temp_entity: !input sensor_entity
  offset_entity: !input offset_entity
  sync_entity: !input sync_entity
  sensor_temp: "{{ states(temp_entity) | round(1) }}"
  sync_temps: "{{ states(sync_entity) }}"
  trv_temp: "{{ state_attr(trv_entity, 'current_temperature') | round(1) }}"
  trv_offset: "{{ states(offset_entity)|float}}"
  friendly_name: "{{ state_attr(trv_entity, 'friendly_name')}}"
  new_offset: "{{ sensor_temp - (trv_temp - trv_offset) | round(1) }}"
trigger:
  - platform: state
    entity_id: !input sensor_entity
  - platform: state
    entity_id: !input sync_entity
conditions:
  - condition: template
    value_template: "{{ (sensor_temp - trv_temp) | abs >= 0.2 }}" # action if diff > 0.2C
  - condition: template
    value_template: '{{ sync_temps == "on" }}' # and if input helper is on
action:
  - action: number.set_value
    data:
      entity_id: !input offset_entity
      value: "{{ new_offset }}"
  - delay: 10